<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
</head>
<body>
    
    <header>
        <nav class="navigation">
            <div>
                <button class="homeBtn">HOME</button>
            </div>
            <div class="navR">
                <button class="todoBtn">Add ToDo</button>
                <button class="aboutBtn">Add Project &rarr;</button>
            </div>
            
        </nav>
    </header>

    <div id="content">
        <div class="cont1">

        </div>
        <div class="midLine"></div>
        <div>
            <dialog>
                <form action="">
                    <input type="text" name="title" placeholder="Title" id="" required>
                    <input type="text" name="description" placeholder="Description" id="" >
                    <input type="date" name="dueDate" placeholder="Due Date" required>
                    <select name="priority" id="">
                        <option value="" selected disabled hidden>Priority</option>
                        <option value="high">High</option>
                        <option value="middle">Normal</option>
                        <option value="low">Low</option>
                    </select>
                </form>
            </dialog>
        </div>
        <div class="cont2">

        </div>

    </div>
</body>
</html>
